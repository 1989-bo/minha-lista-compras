<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.json">
<title>Minha Lista de Compras</title>
<style>
:root{--primary:#2e7d32;--primary2:#43a047;--bg:#f3f5f3;--card:#fff;--text:#263238;--muted:#78909c;--danger:#e53935}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:92px}
header{background:var(--primary);color:#fff;padding:16px 15px calc(14px + env(safe-area-inset-top));text-align:center;font-weight:800;font-size:1.15rem;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0002}
.container{max-width:560px;margin:auto;padding:14px}
.summary{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px #0000000d}
.summary-row{display:flex;justify-content:space-between;align-items:center}
.summary strong{font-size:1.35rem;color:var(--primary)}
.small{font-size:.82rem;color:var(--muted)}
.input-card{background:#fff;padding:12px;border-radius:14px;box-shadow:0 2px 7px #0000000d;margin-bottom:12px}
input,select,button{font-size:1rem}
.row{display:flex;gap:8px;margin-bottom:8px}
input,select{width:100%;padding:12px;border:1px solid #d7dddd;border-radius:9px;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--primary)}
.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}
.add{background:var(--primary);color:#fff;min-width:52px;font-size:1.3rem}
.search{margin-bottom:12px}
.corredor-card{background:#fff;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 7px #0000000d}
.corredor-header{background:#e8f5e9;color:var(--primary);padding:10px 14px;font-weight:800;font-size:.84rem;text-transform:uppercase;display:flex;justify-content:space-between}
.item-list{list-style:none}
.item-list li{display:flex;align-items:center;gap:8px;padding:12px 13px;border-top:1px solid #eee}
.item-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.checkbox{width:23px;height:23px;border:2px solid #b0bec5;border-radius:6px;display:grid;place-items:center;flex:none}
.checkbox.checked{background:var(--primary);border-color:var(--primary)}
.checkbox.checked:after{content:"✓";color:#fff;font-weight:800}
.item-info{min-width:0;flex:1}
.item-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comprado .item-name{text-decoration:line-through;color:#90a4ae}
.item-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:7px;font-weight:800}
.price{width:86px;text-align:right;font-weight:700}
.delete{border:0;background:none;color:var(--danger);font-size:1.1rem;padding:6px}
.empty{text-align:center;color:var(--muted);padding:35px 15px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20;box-shadow:0 -2px 10px #0000000d}
.bottom button{flex:1;background:#f1f3f1;color:#37474f}
.bottom .primary{background:var(--primary);color:#fff}
dialog{border:0;border-radius:16px;padding:0;width:min(92%,430px);box-shadow:0 10px 40px #0005}
dialog::backdrop{background:#0007}
.modal{padding:18px}.modal h2{margin-bottom:14px}.modal-actions{display:flex;gap:8px;margin-top:15px}.modal-actions button{flex:1}
@media(max-width:380px){.price{width:70px}.qty{gap:3px}}
</style>
</head>
<body>
<header>🛒 Minha Lista de Compras</header>
<div class="container">
  <div class="summary">
    <div class="summary-row"><span><b id="count">0</b> itens</span><strong id="total">R$ 0,00</strong></div>
    <div class="small" id="done">0 comprados</div>
  </div>

  <div class="input-card">
    <div class="row">
      <input id="nome" placeholder="Ex.: Leite, arroz, alface..." autocomplete="off">
      <button class="btn add" onclick="adicionar()">+</button>
    </div>
    <div class="row">
      <select id="corredor">
        <option>Hortifrúti</option><option>Laticínios/Frios</option><option>Açougue</option>
        <option>Mercearia</option><option>Bebidas</option><option>Limpeza</option>
        <option>Higiene</option><option>Padaria</option><option>Outros</option>
      </select>
      <input id="preco" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Preço R$">
    </div>
  </div>

  <input class="search" id="busca" placeholder="🔎 Procurar na lista..." oninput="render()">
  <div id="lista"></div>
</div>

<div class="bottom">
  <button onclick="limparComprados()">✓ Limpar comprados</button>
  <button class="primary" onclick="novaLista()">Nova lista</button>
</div>

<dialog id="confirmDialog">
  <div class="modal">
    <h2>Nova lista?</h2>
    <p>Isso vai apagar todos os itens da lista atual.</p>
    <div class="modal-actions">
      <button class="btn" onclick="confirmDialog.close()">Cancelar</button>
      <button class="btn add" onclick="confirmarNovaLista()">Apagar</button>
    </div>
  </div>
</dialog>

<script>
const KEY="supermercado_app_v2";
let compras=JSON.parse(localStorage.getItem(KEY)||"[]");
const ordem=["Hortifrúti","Laticínios/Frios","Açougue","Mercearia","Bebidas","Limpeza","Higiene","Padaria","Outros"];

function save(){localStorage.setItem(KEY,JSON.stringify(compras));render()}
function dinheiro(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function adicionar(){
 const nome=document.getElementById("nome"), preco=document.getElementById("preco");
 if(!nome.value.trim()){nome.focus();return}
 compras.push({id:Date.now()+Math.random(),nome:nome.value.trim(),corredor:document.getElementById("corredor").value,preco:Number(preco.value)||0,qtd:1,comprado:false});
 nome.value="";preco.value="";nome.focus();save();
}
document.getElementById("nome").addEventListener("keydown",e=>{if(e.key==="Enter")adicionar()});
function alternar(id){let x=compras.find(i=>i.id==id);if(x)x.comprado=!x.comprado;save()}
function quantidade(id,delta){let x=compras.find(i=>i.id==id);if(x){x.qtd=Math.max(1,(x.qtd||1)+delta);save()}}
function deletar(id){compras=compras.filter(i=>i.id!=id);save()}
function limparComprados(){compras=compras.filter(i=>!i.comprado);save()}
function novaLista(){document.getElementById("confirmDialog").showModal()}
function confirmarNovaLista(){compras=[];document.getElementById("confirmDialog").close();save()}
function render(){
 const busca=document.getElementById("busca").value.toLowerCase().trim();
 const lista=document.getElementById("lista");lista.innerHTML="";
 const filtrados=compras.filter(i=>i.nome.toLowerCase().includes(busca));
 const grupos={};
 ordem.forEach(c=>grupos[c]=[]);
 filtrados.forEach(i=>(grupos[i.corredor]??=[]).push(i));
 let total=0,done=0;
 compras.forEach(i=>{total+=(Number(i.preco)||0)*(Number(i.qtd)||1);if(i.comprado)done++});
 document.getElementById("count").textContent=compras.reduce((n,i)=>n+(Number(i.qtd)||1),0);
 document.getElementById("total").textContent=dinheiro(total);
 document.getElementById("done").textContent=`${done} ${done===1?"item comprado":"itens comprados"}`;
 let shown=0;
 for(const c of ordem){
   const arr=grupos[c].sort((a,b)=>a.comprado-b.comprado);
   if(!arr.length)continue;
   shown+=arr.length;
   const card=document.createElement("div");card.className="corredor-card";
   card.innerHTML=`<div class="corredor-header"><span>${c}</span><span>${arr.length}</span></div>`;
   const ul=document.createElement("ul");ul.className="item-list";
   arr.forEach(i=>{
     const li=document.createElement("li");
     const subtotal=(Number(i.preco)||0)*(Number(i.qtd)||1);
     li.innerHTML=`
       <div class="item-main ${i.comprado?"comprado":""}" onclick="alternar(${i.id})">
         <div class="checkbox ${i.comprado?"checked":""}"></div>
         <div class="item-info"><div class="item-name">${esc(i.nome)}</div>
         <div class="item-sub">${i.preco?dinheiro(i.preco)+" cada":"Preço não informado"}</div></div>
       </div>
       <div class="qty"><button onclick="event.stopPropagation();quantidade(${i.id},-1)">−</button><b>${i.qtd}</b><button onclick="event.stopPropagation();quantidade(${i.id},1)">+</button></div>
       <div class="price">${i.preco?dinheiro(subtotal):"—"}</div>
       <button class="delete" onclick="deletar(${i.id})" aria-label="Excluir">✕</button>`;
     ul.appendChild(li);
   });
   card.appendChild(ul);lista.appendChild(card);
 }
 if(!shown)lista.innerHTML=`<div class="empty">${compras.length?"Nenhum item encontrado.":"Sua lista está vazia.<br>Adicione o primeiro produto acima."}</div>`;
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
